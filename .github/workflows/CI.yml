name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    env:
      IMAGE: redalert855/weather_app
      PYTHONPATH: .
    steps:
      - name: Checkout (detects the change that triggered this run)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Flask and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit_test.py -v

      - name: Run integration tests
        run: python -m pytest tests/integration_test.py -v

      - name: Run smoke tests
        run: python -m pytest tests/smoke_test.py -v

      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -t $IMAGE:v1 .

      - name: Build test (launch container and run a command in it)
        run: |
          docker run -d --name build-test $IMAGE:${{ github.sha }}
          sleep 5
          docker exec build-test python --version
          test "$(docker inspect -f '{{.State.Running}}' build-test)" = "true"
          docker rm -f build-test

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:v1
