name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Roll out new image (zero downtime)
        run: |
          kubectl set image deployment/weather-app \
            weather-app=redalert855/weather_app:${{ github.event.workflow_run.head_sha }}
          kubectl rollout status deployment/weather-app --timeout=120s
